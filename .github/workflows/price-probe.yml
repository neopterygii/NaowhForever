name: Price feed probe

# Temporary: checks Blizzard's Forever auction data with the repo's API client before the feed is
# wired into releases. Removed before the pull request.
on:
  push:
    branches:
      - feat/auction-price-feed
    paths:
      - Tools/build/auction_feed.py
      - .github/workflows/price-probe.yml

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Probe
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
        run: |
          python3 Tools/build/auction_feed.py --summary
          start=$(date +%s)
          python3 Tools/build/auction_feed.py --out "$RUNNER_TEMP/Prices.lua"
          echo "full build took $(( $(date +%s) - start )) s"

      - name: Keep the built file
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prices
          path: ${{ runner.temp }}/Prices.lua
          retention-days: 3
